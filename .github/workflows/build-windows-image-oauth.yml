name: Build Windows Image OAuth Hotfix

on:
  push:
    branches:
      - build/codex-image-oauth-windows
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Windows x64 portable + NSIS
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Codex image OAuth fallback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content 'src-tauri/src/proxy/handlers.rs' -Raw
          $markers = @(
            'handle_image_generations',
            'resolve_codex_image_generation_provider',
            'codex_image_generation_route_probe_models',
            'provider_is_codex_image_generation_oauth_target',
            'sanitize_codex_image_generation_provider',
            'gpt-image-'
          )
          foreach ($marker in $markers) {
            if (-not $source.Contains($marker)) {
              throw "Missing required Codex image OAuth marker: $marker"
            }
          }
          Write-Host 'Codex image OAuth fallback markers verified.'

      - name: Run image-generation regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml image_generation --lib

      - name: Build Windows history repair sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --manifest-path src-tauri/Cargo.toml --bin codex-history-repairer --features history-repairer --release
          if (-not (Test-Path 'src-tauri/target/release/codex-history-repairer.exe')) {
            throw 'codex-history-repairer.exe was not produced'
          }

      - name: Disable updater signing for fork build
        shell: pwsh
        run: |
          @'
          {
            "bundle": {
              "createUpdaterArtifacts": false
            }
          }
          '@ | Set-Content 'src-tauri/tauri.hotfix.conf.json' -Encoding utf8

      - name: Build unsigned Windows x64 app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm tauri build --bundles nsis --config src-tauri/tauri.hotfix.conf.json

      - name: Collect artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifact | Out-Null

          $portable = 'src-tauri/target/release/cc-switch.exe'
          if (-not (Test-Path $portable)) {
            throw "Portable executable not found: $portable"
          }
          Copy-Item $portable 'artifact/CCSwitchMulti-image-oauth-x64.exe'

          $sidecar = 'src-tauri/target/release/codex-history-repairer.exe'
          if (Test-Path $sidecar) {
            Copy-Item $sidecar 'artifact/codex-history-repairer.exe'
          }

          $installers = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File -ErrorAction SilentlyContinue
          foreach ($installer in $installers) {
            Copy-Item $installer.FullName (Join-Path 'artifact' $installer.Name)
          }

          @"
          CCSwitchMulti fork build
          Source: Qin-long/ccswitchmulti
          Branch: $env:GITHUB_REF_NAME
          Commit: $env:GITHUB_SHA

          This build verifies the current Codex image-generation OAuth fallback before compiling.
          The gpt-image-* hidden tool model does not need to appear in the normal chat model picker.
          This is an unsigned personal fork build and does not require an OpenAI Platform API key.
          "@ | Set-Content 'artifact/BUILD-INFO.txt' -Encoding utf8

          Get-ChildItem artifact | Format-Table Name,Length

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CCSwitchMulti-Windows-x64-image-oauth
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
